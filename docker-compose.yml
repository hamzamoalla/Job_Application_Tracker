services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Admin12345!
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin


  mlflow-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: jobtracker
    entrypoint:
      - /bin/sh
      - -c
      - |
        psql -h postgres -U jobtracker -d jobtracker -tc \
          "SELECT 1 FROM pg_database WHERE datname='mlflow'" | grep -q 1 \
        || psql -h postgres -U jobtracker -d jobtracker -c 'CREATE DATABASE mlflow;'
    depends_on:
      postgres:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command:
      - /bin/bash
      - -c
      - |
        pip install --quiet psycopg2-binary &&
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri postgresql://jobtracker:jobtracker@postgres:5432/mlflow \
          --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow-db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://jobtracker:jobtracker@postgres:5432/jobtracker
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - models_data:/app/models

  classifier-worker:
    build:
      context: .
      dockerfile: services/classifier-worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://jobtracker:jobtracker@postgres:5432/jobtracker
      MODEL_DIR: /app/models
      POLL_INTERVAL: "15"
      MIN_CONFIDENCE: "0.80"
      REVIEW_CONFIDENCE_THRESHOLD: "0.70"
      SENTENCE_TRANSFORMERS_HOME: /app/st_cache
      HF_HOME: /app/hf_cache
      ENABLE_GLINER_FALLBACK: "true"
      GLINER_MODEL_NAME: urchade/gliner_multi-v2.1
      GLINER_THRESHOLD: "0.4"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - models_data:/app/models
      - st_cache:/app/st_cache
      - hf_cache:/app/hf_cache

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  mail-importer:
    build:
      context: .
      dockerfile: services/mail-importer/Dockerfile
    environment:
      API_URL: http://api:8000/emails
      AUTH_DIR: /app/auth
    ports:
      - "8081:8000"
    volumes:
      - mail_auth_data:/app/auth
    depends_on:
      - api

  trainer:
    build:
      context: .
      dockerfile: services/trainer/Dockerfile
    environment:
      DATABASE_URL: postgresql://jobtracker:jobtracker@postgres:5432/jobtracker
      MODEL_DIR: /app/models
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: jobtracker-classification
      EMBEDDING_MODEL_NAME: paraphrase-multilingual-MiniLM-L12-v2
      SENTENCE_TRANSFORMERS_HOME: /app/st_cache
      HF_HOME: /app/hf_cache
      LOG_LEVEL: INFO
      MIN_F1_TO_PUBLISH: "0.80"
      MAX_F1_REGRESSION: "0.03"
    volumes:
      - models_data:/app/models
      - st_cache:/app/st_cache
      - hf_cache:/app/hf_cache
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    profiles:
      - train

volumes:
  postgres_data:
  models_data:
  pgadmin_data:
  mlflow_artifacts:
  # credentials.json + token.json uploaded through mail-importer's /auth/upload
  mail_auth_data:
  st_cache:
  hf_cache:
